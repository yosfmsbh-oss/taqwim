      - name: Fetch fonts
        run: |
          mkdir -p fonts-dl taqwim-android/app/src/main/assets/fonts taqwim-android/app/src/main/res/font
          cd fonts-dl
          npm init -y >/dev/null 2>&1 || true
          for pkg in cairo tajawal amiri almarai el-messiri lalezar poppins montserrat playfair-display bebas-neue orbitron pacifico; do
            npm i --no-audit --no-fund "@expo-google-fonts/$pkg" >/dev/null 2>&1 || echo "skip $pkg"
          done
          cd ..
          SYS=$(find /usr/share/fonts -name '*.ttf' | head -1)
          for pair in cairo:cairo tajawal:tajawal amiri:amiri almarai:almarai elmessiri:el-messiri lalezar:lalezar poppins:poppins montserrat:montserrat playfair:playfair-display bebas:bebas-neue orbitron:orbitron pacifico:pacifico; do
            key=${pair%%:*}; pkg=${pair##*:}
            f=$(ls fonts-dl/node_modules/@expo-google-fonts/$pkg/*700Bold.ttf 2>/dev/null | head -1)
            [ -z "$f" ] && f=$(ls fonts-dl/node_modules/@expo-google-fonts/$pkg/*400Regular.ttf 2>/dev/null | head -1)
            [ -z "$f" ] && f="$SYS"
            cp "$f" taqwim-android/app/src/main/assets/fonts/$key.ttf
            case $key in poppins|montserrat|playfair|bebas|orbitron|pacifico) cp "$f" taqwim-android/app/src/main/res/font/$key.ttf;; esac
          done
          ls -la taqwim-android/app/src/main/res/font
      - name: Build debug APK
        working-directory: taqwim-android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: taqwim-apk
          path: taqwim-android/app/build/outputs/apk/debug/app-debug.apk
